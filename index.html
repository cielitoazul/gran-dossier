<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gran Dossier</title>
<style>
  :root { --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#64748b; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d0f14; --card:#13161d; --text:#e8eaf0; --muted:#8b90a0; --accent:#60a5fa; }
  }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--text);
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { background:var(--card); border-radius:16px; padding:32px 28px; max-width:480px; width:100%;
          box-shadow:0 1px 3px #0002; text-align:center; }
  h1 { font-size:28px; margin-bottom:8px; }
  p { color:var(--muted); line-height:1.5; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin-right:6px; }
</style>
</head>
<body>
  <div class="card">
    <h1>📚 Gran Dossier</h1>
    <p><span class="dot"></span>En construcción</p>
  </div>
</body>
</html>
